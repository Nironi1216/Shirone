<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#6750A4" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="发动态" />
		<title>发动态 · Neyuuのblog</title>
		<link rel="manifest" href="./manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/favicon/favicon-dark-180.png" />
		<style>
			:root {
				--primary: #6750a4;
				--on-primary: #ffffff;
				--primary-container: #e9ddff;
				--surface: #fdf7ff;
				--surface-container: #f3edf7;
				--surface-high: #ece6f0;
				--on-surface: #1d1b20;
				--on-surface-variant: #49454f;
				--outline: #79747e;
				--outline-variant: #cac4d0;
				--error: #b3261e;
				--ok: #2e7d32;
				--radius-l: 20px;
				--radius-m: 12px;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				padding: 0;
			}
			body {
				background: var(--surface);
				color: var(--on-surface);
				font-family:
					-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
					"Microsoft YaHei", system-ui, sans-serif;
				font-size: 15px;
				line-height: 1.6;
				-webkit-text-size-adjust: 100%;
				padding: 16px 14px calc(96px + env(safe-area-inset-bottom));
				max-width: 720px;
				margin: 0 auto;
			}
			h1 {
				font-size: 1.25rem;
				margin: 4px 0 2px;
			}
			.sub {
				margin: 0 0 16px;
				color: var(--on-surface-variant);
				font-size: 0.8125rem;
			}
			.card {
				background: #fff;
				border: 1px solid var(--outline-variant);
				border-radius: var(--radius-l);
				padding: 14px;
				margin-bottom: 12px;
			}
			.card > h2 {
				margin: 0 0 10px;
				font-size: 0.875rem;
				font-weight: 600;
				color: var(--on-surface-variant);
				letter-spacing: 0.02em;
			}
			label.field {
				display: block;
				margin-bottom: 10px;
			}
			label.field > span {
				display: block;
				font-size: 0.75rem;
				color: var(--on-surface-variant);
				margin-bottom: 4px;
			}
			input[type="text"],
			input[type="password"],
			select,
			textarea {
				width: 100%;
				font: inherit;
				color: inherit;
				background: var(--surface-container);
				border: 1px solid transparent;
				border-radius: var(--radius-m);
				padding: 10px 12px;
				outline: none;
				transition: border-color 0.15s, background 0.15s;
			}
			input:focus,
			select:focus,
			textarea:focus {
				border-color: var(--primary);
				background: #fff;
			}
			textarea {
				min-height: 132px;
				resize: vertical;
				line-height: 1.65;
			}
			.row {
				display: flex;
				gap: 8px;
			}
			.row > * {
				flex: 1;
				min-width: 0;
			}
			.checks {
				display: flex;
				gap: 16px;
				flex-wrap: wrap;
				margin: 2px 0 10px;
				font-size: 0.8125rem;
				color: var(--on-surface-variant);
			}
			.checks label {
				display: inline-flex;
				align-items: center;
				gap: 6px;
			}
			input[type="checkbox"] {
				width: 16px;
				height: 16px;
				accent-color: var(--primary);
			}
			button {
				font: inherit;
				cursor: pointer;
				border: none;
				border-radius: 999px;
				padding: 10px 18px;
				transition: transform 0.12s, filter 0.12s, background 0.15s;
			}
			button:active {
				transform: scale(0.98);
			}
			button.primary {
				background: var(--primary);
				color: var(--on-primary);
				font-weight: 600;
			}
			button.tonal {
				background: var(--primary-container);
				color: var(--primary);
				font-weight: 600;
			}
			button.text {
				background: transparent;
				color: var(--primary);
				padding: 8px 12px;
			}
			button:disabled {
				opacity: 0.45;
				cursor: not-allowed;
			}
			.actions {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
				align-items: center;
				margin-top: 4px;
			}
			.thumbs {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
				gap: 8px;
				margin-top: 8px;
			}
			.thumb {
				position: relative;
				aspect-ratio: 1;
				border-radius: var(--radius-m);
				overflow: hidden;
				background: var(--surface-high);
			}
			.thumb img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
			}
			.thumb button {
				position: absolute;
				top: 4px;
				right: 4px;
				width: 24px;
				height: 24px;
				padding: 0;
				border-radius: 50%;
				background: rgba(0, 0, 0, 0.55);
				color: #fff;
				font-size: 14px;
				line-height: 24px;
			}
			.picker {
				display: inline-flex;
				align-items: center;
				gap: 6px;
				padding: 8px 14px;
				border-radius: 999px;
				background: var(--surface-container);
				color: var(--on-surface-variant);
				font-size: 0.8125rem;
				cursor: pointer;
			}
			.picker input {
				display: none;
			}
			#previewWrap {
				display: none;
			}
			#previewWrap.on {
				display: block;
			}
			pre.md {
				margin: 0;
				padding: 12px;
				background: var(--surface-container);
				border-radius: var(--radius-m);
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 0.75rem;
				line-height: 1.6;
				white-space: pre-wrap;
				word-break: break-all;
				max-height: 320px;
				overflow: auto;
			}
			.chip {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				padding: 3px 10px;
				border-radius: 999px;
				font-size: 0.75rem;
				font-weight: 600;
			}
			.chip.ok {
				background: #e6f4ea;
				color: var(--ok);
			}
			.chip.warn {
				background: #fdf1e3;
				color: #8a4b00;
			}
			.chip.err {
				background: #fce8e6;
				color: var(--error);
			}
			#log {
				margin: 10px 0 0;
				padding: 0;
				list-style: none;
				font-size: 0.8125rem;
			}
			#log li {
				display: flex;
				gap: 8px;
				padding: 3px 0;
				color: var(--on-surface-variant);
			}
			#log li .dot {
				width: 14px;
				flex: 0 0 14px;
				text-align: center;
			}
			#log li.done .dot {
				color: var(--ok);
			}
			#log li.fail {
				color: var(--error);
			}
			#log li.fail .dot {
				color: var(--error);
			}
			.note {
				font-size: 0.75rem;
				color: var(--on-surface-variant);
				margin: 8px 0 0;
			}
			.bar {
				position: fixed;
				left: 0;
				right: 0;
				bottom: 0;
				padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
				background: color-mix(in srgb, var(--surface) 88%, transparent);
				backdrop-filter: blur(12px);
				border-top: 1px solid var(--outline-variant);
				display: flex;
				gap: 10px;
				max-width: 720px;
				margin: 0 auto;
			}
			.bar button.primary {
				flex: 1;
			}
			details summary {
				cursor: pointer;
				font-size: 0.875rem;
				font-weight: 600;
				color: var(--on-surface-variant);
				list-style: none;
			}
			details summary::-webkit-details-marker {
				display: none;
			}
			details[open] summary {
				margin-bottom: 10px;
			}
			code {
				font-family: ui-monospace, Menlo, monospace;
				background: var(--surface-high);
				padding: 1px 5px;
				border-radius: 5px;
				font-size: 0.9em;
			}
		</style>
	</head>
	<body>
		<h1>发一条动态</h1>
		<p class="sub">
			写好后提交到 GitHub，Vercel 会自动重建，约 1–5 分钟后出现在
			<a href="/moments/">动态页</a>。
		</p>

		<section class="card">
			<details id="settingsBox">
				<summary>
					连接设置
					<span id="connChip" class="chip warn" style="margin-left: 6px">未配置</span>
				</summary>
				<label class="field">
					<span>GitHub Token（fine-grained，只需本仓库 Contents 读写）</span>
					<input
						id="token"
						type="password"
						inputmode="text"
						autocomplete="off"
						placeholder="github_pat_..."
					/>
				</label>
				<div class="row">
					<label class="field">
						<span>仓库所有者</span>
						<input id="owner" type="text" placeholder="Nironi1216" />
					</label>
					<label class="field">
						<span>仓库名</span>
						<input id="repo" type="text" placeholder="Shirone" />
					</label>
				</div>
				<label class="field">
					<span>分支</span>
					<input id="branch" type="text" placeholder="main" />
				</label>
				<div class="actions">
					<button class="primary" id="saveCfg">保存</button>
					<button class="tonal" id="testCfg">测试连接</button>
					<button class="text" id="clearCfg">清除 Token</button>
				</div>
				<p class="note">
					Token 只保存在这台设备的浏览器里，不会写进仓库。换设备或清了浏览器数据需要重新填。
				</p>
			</details>
		</section>

		<section class="card">
			<h2>内容</h2>
			<label class="field">
				<span>正文（支持 Markdown：**加粗**、`代码`、[链接](https://...)、- 列表）</span>
				<textarea id="body" placeholder="此刻在想什么…"></textarea>
			</label>

			<div class="row">
				<label class="field">
					<span>心情</span>
					<select id="mood"></select>
				</label>
				<label class="field">
					<span>地点</span>
					<input id="location" type="text" placeholder="可选，如 深圳" />
				</label>
			</div>

			<label class="field">
				<span>标签（逗号或空格分隔，可选）</span>
				<input id="tags" type="text" placeholder="日常, 随手拍" />
			</label>

			<div class="checks">
				<label><input type="checkbox" id="pinned" /> 置顶</label>
				<label><input type="checkbox" id="draft" /> 存为草稿（不上线）</label>
			</div>

			<div class="actions">
				<label class="picker">
					＋ 添加图片
					<input id="files" type="file" accept="image/*" multiple />
				</label>
				<span class="note" style="margin: 0" id="imgHint">自动压缩到 1600px 的 WebP</span>
			</div>
			<div class="thumbs" id="thumbs"></div>
		</section>

		<section class="card">
			<div class="actions">
				<button class="tonal" id="previewBtn">预览 Markdown</button>
				<button class="text" id="copyBtn">复制到剪贴板</button>
			</div>
			<div id="previewWrap">
				<pre class="md" id="previewOut"></pre>
			</div>
			<ul id="log"></ul>
		</section>

		<div class="bar">
			<button class="tonal" id="viewBtn">看动态页</button>
			<button class="primary" id="publishBtn">发布</button>
		</div>

		<script type="module">
			const cfgKey = "shirone.moments.cfg";
			const MOODS = [
				["", "不设置"],
				["material-symbols:sentiment-excited-outline-rounded", "开心"],
				["material-symbols:sentiment-satisfied-outline-rounded", "轻松"],
				["material-symbols:sentiment-neutral-outline-rounded", "平静"],
				["material-symbols:sentiment-dissatisfied-outline-rounded", "有点丧"],
				["material-symbols:sentiment-very-dissatisfied-outline-rounded", "糟糕"],
				["material-symbols:local-cafe-outline-rounded", "咖啡"],
				["material-symbols:bedtime-outline-rounded", "深夜"],
				["material-symbols:music-note-rounded", "听歌"],
				["material-symbols:wb-sunny-outline-rounded", "好天气"],
				["material-symbols:book-outline-rounded", "读书"],
				["material-symbols:code-rounded", "写代码"],
				["material-symbols:photo-camera-outline", "拍照"],
				["material-symbols:bolt-rounded", "加速"],
				["material-symbols:favorite-outline-rounded", "喜欢"],
			];

			const $ = (id) => document.getElementById(id);
			const el = {
				settingsBox: $("settingsBox"),
				token: $("token"),
				owner: $("owner"),
				repo: $("repo"),
				branch: $("branch"),
				connChip: $("connChip"),
				body: $("body"),
				mood: $("mood"),
				location: $("location"),
				tags: $("tags"),
				pinned: $("pinned"),
				draft: $("draft"),
				files: $("files"),
				thumbs: $("thumbs"),
				imgHint: $("imgHint"),
				previewWrap: $("previewWrap"),
				previewOut: $("previewOut"),
				log: $("log"),
				publishBtn: $("publishBtn"),
			};

			/** @type {{token:string, owner:string, repo:string, branch:string}} */
			let cfg = { token: "", owner: "Nironi1216", repo: "Shirone", branch: "main" };
			/** @type {{id:string, name:string, blob:Blob, url:string}[]} */
			let images = [];

			/* ---------- 配置 ---------- */
			function loadCfg() {
				try {
					const raw = localStorage.getItem(cfgKey);
					if (raw) cfg = { ...cfg, ...JSON.parse(raw) };
				} catch {}
				el.token.value = cfg.token || "";
				el.owner.value = cfg.owner || "";
				el.repo.value = cfg.repo || "";
				el.branch.value = cfg.branch || "main";
				renderChip();
				if (!cfg.token) el.settingsBox.open = true;
			}

			function saveCfg() {
				cfg = {
					token: el.token.value.trim(),
					owner: el.owner.value.trim() || "Nironi1216",
					repo: el.repo.value.trim() || "Shirone",
					branch: el.branch.value.trim() || "main",
				};
				localStorage.setItem(cfgKey, JSON.stringify(cfg));
				renderChip();
			}

			function renderChip() {
				const ok = Boolean(cfg.token);
				el.connChip.className = "chip " + (ok ? "ok" : "warn");
				el.connChip.textContent = ok ? `已连接 ${cfg.owner}/${cfg.repo}` : "未配置";
			}

			/* ---------- 心情下拉 ---------- */
			MOODS.forEach(([value, label]) => {
				const o = document.createElement("option");
				o.value = value;
				o.textContent = label;
				el.mood.appendChild(o);
			});

			/* ---------- 图片压缩 ---------- */
			const MAX_EDGE = 1600;
			const QUALITY = 0.86;

			async function compress(file) {
				const bitmap = await createImageBitmap(file);
				const scale = Math.min(1, MAX_EDGE / Math.max(bitmap.width, bitmap.height));
				const w = Math.round(bitmap.width * scale);
				const h = Math.round(bitmap.height * scale);
				const canvas = document.createElement("canvas");
				canvas.width = w;
				canvas.height = h;
				const ctx = canvas.getContext("2d");
				ctx.drawImage(bitmap, 0, 0, w, h);
				bitmap.close?.();
				const blob = await new Promise((resolve) =>
					canvas.toBlob(resolve, "image/webp", QUALITY),
				);
				if (!blob) throw new Error("图片转换失败");
				return blob;
			}

			el.files.addEventListener("change", async (e) => {
				const picked = Array.from(e.target.files || []);
				if (!picked.length) return;
				el.imgHint.textContent = "压缩中…";
				for (const file of picked) {
					if (images.length >= 9) break;
					try {
						const blob = await compress(file);
						const id = crypto.randomUUID();
						images.push({
							id,
							name: file.name.replace(/\.[^.]+$/, ""),
							blob,
							url: URL.createObjectURL(blob),
						});
					} catch (err) {
						console.warn(err);
					}
				}
				el.files.value = "";
				renderThumbs();
				el.imgHint.textContent = "自动压缩到 1600px 的 WebP";
			});

			function renderThumbs() {
				el.thumbs.innerHTML = "";
				for (const img of images) {
					const box = document.createElement("div");
					box.className = "thumb";
					const im = document.createElement("img");
					im.src = img.url;
					im.alt = img.name;
					const del = document.createElement("button");
					del.type = "button";
					del.textContent = "×";
					del.title = "移除";
					del.addEventListener("click", () => {
						URL.revokeObjectURL(img.url);
						images = images.filter((x) => x.id !== img.id);
						renderThumbs();
					});
					box.append(im, del);
					el.thumbs.appendChild(box);
				}
			}

			/* ---------- 生成 Markdown ---------- */
			function pad(n) {
				return String(n).padStart(2, "0");
			}

			function stamp(d = new Date()) {
				const off = -d.getTimezoneOffset();
				const sign = off >= 0 ? "+" : "-";
				const abs = Math.abs(off);
				return {
					iso: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(
						d.getHours(),
					)}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${sign}${pad(
						Math.floor(abs / 60),
					)}:${pad(abs % 60)}`,
					slug: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}-${pad(
						d.getHours(),
					)}${pad(d.getMinutes())}${pad(d.getSeconds())}`,
				};
			}

			function yamlStr(value) {
				return '"' + String(value).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
			}

			function parseTags(raw) {
				return raw
					.split(/[,，\s]+/)
					.map((t) => t.trim())
					.filter(Boolean)
					.slice(0, 8);
			}

			function buildMarkdown() {
				const t = stamp();
				const lines = ["---", `published: ${t.iso}`];
				if (el.pinned.checked) lines.push("pinned: true");
				const loc = el.location.value.trim();
				if (loc) lines.push(`location: ${yamlStr(loc)}`);
				const mood = el.mood.value;
				if (mood) lines.push(`mood: ${mood}`);
				const tags = parseTags(el.tags.value);
				if (tags.length) {
					lines.push("tags:");
					tags.forEach((tag) => lines.push(`  - ${yamlStr(tag)}`));
				}
				if (images.length) {
					lines.push("images:");
					images.forEach((_, i) =>
						lines.push(
							`  - src: /images/moments/${t.slug}/img-${i + 1}.webp`,
							'    alt: ""',
						),
					);
				}
				if (el.draft.checked) lines.push("draft: true");
				lines.push("---", "", el.body.value.trim(), "");
				return {
					slug: t.slug,
					path: `src/content/moments/${t.slug}.md`,
					text: lines.join("\n"),
					message: `feat(moments): 新动态 ${t.slug.slice(0, 10)} ${t.slug.slice(11, 13)}:${t.slug.slice(13, 15)}`,
				};
			}

			/* ---------- GitHub API ---------- */
			function api(path) {
				return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}${path}`;
			}

			async function gh(path, options = {}) {
				const res = await fetch(api(path), {
					...options,
					headers: {
						Authorization: `Bearer ${cfg.token}`,
						Accept: "application/vnd.github+json",
						"X-GitHub-Api-Version": "2022-11-28",
						"Content-Type": "application/json",
						...(options.headers || {}),
					},
				});
				const text = await res.text();
				let data = null;
				try {
					data = text ? JSON.parse(text) : null;
				} catch {
					data = { message: text };
				}
				if (!res.ok) {
					const msg = data?.message || `HTTP ${res.status}`;
					throw new Error(`${res.status} ${msg}`);
				}
				return data;
			}

			function b64(buffer) {
				const bytes = new Uint8Array(buffer);
				let binary = "";
				const chunk = 0x8000;
				for (let i = 0; i < bytes.length; i += chunk) {
					binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
				}
				return btoa(binary);
			}

			/** 一次提交写入多个文件（Git Data API），只触发一次构建 */
			async function commitFiles(files, message) {
				const ref = await gh(`/git/ref/heads/${encodeURIComponent(cfg.branch)}`);
				const headSha = ref.object.sha;
				const headCommit = await gh(`/git/commits/${headSha}`);

				const blobs = [];
				for (const file of files) {
					const blob = await gh("/git/blobs", {
						method: "POST",
						body: JSON.stringify({
							content: b64(await file.blob.arrayBuffer()),
							encoding: "base64",
						}),
					});
					blobs.push({ path: file.path, mode: "100644", type: "blob", sha: blob.sha });
				}

				const tree = await gh("/git/trees", {
					method: "POST",
					body: JSON.stringify({ base_tree: headCommit.tree.sha, tree: blobs }),
				});
				const commit = await gh("/git/commits", {
					method: "POST",
					body: JSON.stringify({ message, tree: tree.sha, parents: [headSha] }),
				});
				await gh(`/git/refs/heads/${encodeURIComponent(cfg.branch)}`, {
					method: "PATCH",
					body: JSON.stringify({ sha: commit.sha, force: false }),
				});
				return commit;
			}

			/* ---------- 日志 ---------- */
			function clearLog() {
				el.log.innerHTML = "";
			}
			function logStep(text) {
				const li = document.createElement("li");
				li.innerHTML = `<span class="dot">·</span><span>${text}</span>`;
				el.log.appendChild(li);
				return {
					done(msg) {
						li.classList.add("done");
						li.querySelector(".dot").textContent = "✓";
						if (msg) li.lastElementChild.textContent = msg;
					},
					fail(msg) {
						li.classList.add("fail");
						li.querySelector(".dot").textContent = "✗";
						if (msg) li.lastElementChild.textContent = msg;
					},
				};
			}

			/* ---------- 交互 ---------- */
			$("saveCfg").addEventListener("click", () => {
				saveCfg();
				clearLog();
				logStep("配置已保存到本机").done();
			});

			$("clearCfg").addEventListener("click", () => {
				localStorage.removeItem(cfgKey);
				cfg.token = "";
				el.token.value = "";
				renderChip();
				clearLog();
				logStep("已清除 Token").done();
			});

			$("testCfg").addEventListener("click", async () => {
				saveCfg();
				clearLog();
				const step = logStep("正在连接 GitHub…");
				try {
					const ref = await gh(`/git/ref/heads/${encodeURIComponent(cfg.branch)}`);
					step.done(`连接正常，${cfg.branch} 分支最新提交 ${ref.object.sha.slice(0, 7)}`);
				} catch (err) {
					step.fail(`连接失败：${err.message}`);
				}
			});

			$("previewBtn").addEventListener("click", () => {
				const md = buildMarkdown();
				el.previewOut.textContent = md.text;
				el.previewWrap.classList.add("on");
			});

			$("copyBtn").addEventListener("click", async () => {
				const md = buildMarkdown();
				el.previewOut.textContent = md.text;
				el.previewWrap.classList.add("on");
				try {
					await navigator.clipboard.writeText(md.text);
					clearLog();
					logStep("已复制 Markdown，可粘贴到仓库里手动提交").done();
				} catch {
					clearLog();
					logStep("复制失败，请长按预览框手动复制").fail();
				}
			});

			$("viewBtn").addEventListener("click", () => window.open("/moments/", "_blank"));

			el.publishBtn.addEventListener("click", async () => {
				if (!el.body.value.trim() && images.length === 0) {
					clearLog();
					logStep("正文和图片都是空的，没东西可发").fail();
					return;
				}
				if (!cfg.token) {
					el.settingsBox.open = true;
					clearLog();
					logStep("请先填写并保存 GitHub Token").fail();
					return;
				}
				el.publishBtn.disabled = true;
				clearLog();
				const md = buildMarkdown();
				const files = [];
				images.forEach((img, i) =>
					files.push({
						path: `public/images/moments/${md.slug}/img-${i + 1}.webp`,
						blob: img.blob,
					}),
				);
				files.push({
					path: md.path,
					blob: new Blob([md.text], { type: "text/markdown" }),
				});

				const stepFetch = logStep("读取仓库分支…");
				try {
					const t0 = performance.now();
					const commit = await commitFiles(files, md.message);
					stepFetch.done(`已提交 ${files.length} 个文件（${Math.round(performance.now() - t0)}ms）`);

					const stepDeploy = logStep("等待 Vercel 自动构建…");
					stepDeploy.done("构建通常 1–5 分钟，完成后刷新动态页即可看到");

					const link = document.createElement("li");
					const url = `https://github.com/${cfg.owner}/${cfg.repo}/commit/${commit.sha}`;
					link.innerHTML = `<span class="dot">↗</span><a href="${url}" target="_blank" rel="noopener">查看本次提交 ${commit.sha.slice(0, 7)}</a>`;
					el.log.appendChild(link);

					el.body.value = "";
					el.tags.value = "";
					el.location.value = "";
					el.mood.value = "";
					el.pinned.checked = false;
					el.draft.checked = false;
					images.forEach((img) => URL.revokeObjectURL(img.url));
					images = [];
					renderThumbs();
					el.previewWrap.classList.remove("on");
				} catch (err) {
					stepFetch.fail(`提交失败：${err.message}`);
				} finally {
					el.publishBtn.disabled = false;
				}
			});

			loadCfg();

			// 便于自动化检查
			window.__moments = {
				buildMarkdown,
				get cfg() {
					return { ...cfg, token: cfg.token ? "***" : "" };
				},
			};
		</script>
	</body>
</html>
